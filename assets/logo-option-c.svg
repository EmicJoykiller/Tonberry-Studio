  <path d="m349 374-6-60c-1-10 8-13 17-6l35 28c-9 16-14 33-14 51-11-7-22-11-32-13z" fill="#F18B43"/>
  <path d="M449 330c19-16 46-16 65-5l-4 42c-17 11-36 12-56 5-8-11-10-27-5-42z" fill="#F18B43"/>
  <ellipse cx="388" cy="405" rx="10" ry="14" fill="#26334C"/><ellipse cx="455" cy="405" rx="10" ry="14" fill="#26334C"/>
  <circle cx="386" cy="401" r="3" fill="#FFFEFA"/><circle cx="453" cy="401" r="3" fill="#FFFEFA"/>
  <ellipse cx="366" cy="429" rx="12" ry="6" fill="#F2A19A"/><ellipse cx="476" cy="429" rx="12" ry="6" fill="#F2A19A"/>
