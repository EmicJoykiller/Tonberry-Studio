  <!-- Smaller tuxedo cat head, tilted toward the other -->
  <path d="m489 411-4-68c-1-12 9-16 19-8l34 27c21-7 44-6 63 4l35-29c10-8 20-3 19 9l-5 66c-4 45-32 70-78 70-47 0-80-25-83-71z" fill="#222A3C" stroke="#26334C" stroke-width="7" stroke-linejoin="round"/>
  <path d="M544 365c8 15 9 32 6 51-3 19-11 31-25 38-20-9-32-25-33-47 22-3 38-18 52-42z" fill="#FFFEFA"/>
  <ellipse cx="518" cy="406" rx="8" ry="12" fill="#FFFEFA"/><ellipse cx="579" cy="406" rx="8" ry="12" fill="#FFFEFA"/>
