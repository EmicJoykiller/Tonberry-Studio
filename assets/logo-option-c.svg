<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
  <title id="title">Tonberry Studio logo option C — round of play</title>
  <desc id="desc">A larger orange-and-white cat and smaller tuxedo cat reach their paws together inside a clean circular frame.</desc>
  <rect width="1000" height="850" rx="48" fill="#FBF9F3"/>
  <!-- Clean open circle, with a small gap where their tails meet. -->
  <path d="M500 196a185 185 0 0 0-130 317" fill="none" stroke="#E98A47" stroke-width="17" stroke-linecap="round"/>
  <path d="M500 196a185 185 0 0 1 130 317" fill="none" stroke="#26334C" stroke-width="17" stroke-linecap="round"/>
  <path d="M370 513a185 185 0 0 0 260 0" fill="none" stroke="#91C9A1" stroke-width="17" stroke-linecap="round"/>
  <!-- The two tucked bodies -->
  <path d="M333 544c-5-68 28-128 94-137 59-8 99 31 100 91l1 54c0 20-12 31-33 31h-124c-22 0-36-15-38-39z" fill="#FFFEFA" stroke="#26334C" stroke-width="7" stroke-linejoin="round"/>
  <path d="M358 472c14-34 39-53 72-55 22-1 41 7 54 22l-12 33c-34-9-66 0-98 23z" fill="#F18B43"/>
  <path d="M472 549c-4-56 23-115 77-132 55-18 100 22 102 77l1 53c0 20-12 35-33 35H507c-23 0-33-11-35-33z" fill="#222A3C" stroke="#26334C" stroke-width="7" stroke-linejoin="round"/>
